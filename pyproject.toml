[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-ai-research-lab"
version = "0.1.0"
description = "A structured learning and research laboratory for Robotics, AI, ML, DL, and RL"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Robotics AI Research Lab", email = "research@example.com"}
]
requires-python = ">=3.9"

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.5.0",
    "sympy>=1.10",
    "gymnasium>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "mypy>=0.910",
    "black>=22.0.0",
    "flake8>=3.9.0",
]
jupyter = [
    "jupyter>=1.0.0",
    "ipython>=7.30.0",
    "ipykernel>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/robotics-ai-research-lab"
Repository = "https://github.com/yourusername/robotics-ai-research-lab.git"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
